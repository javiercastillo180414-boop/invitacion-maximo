<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Confirmación | Máximo</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:linear-gradient(145deg,#dceefa,#fff 55%,#fff4db);font-family:Montserrat,Arial,sans-serif;color:#4a5b70;padding:18px}.card{width:min(100%,560px);margin:auto;background:#fff;border-radius:28px;padding:28px 22px 24px;box-shadow:0 20px 60px rgba(49,88,137,.16)}.close{display:block;margin:0 0 8px auto;border:0;background:#eef5fb;color:#315889;border-radius:50%;width:38px;height:38px;font-size:22px;cursor:pointer}.kicker{text-align:center;font-size:.6rem;letter-spacing:.2em;color:#b49a72;font-weight:700}.title{text-align:center;font:2.8rem Georgia,serif;color:#315889;margin:5px 0 8px}.sub{text-align:center;font-size:.78rem;line-height:1.6;margin:0 auto 22px;max-width:390px}.form{display:grid;gap:13px}.form label{font-size:.62rem;font-weight:700;letter-spacing:.08em;color:#315889}.form input,.form select,.form textarea{width:100%;margin-top:6px;border:1px solid #d9e3ec;border-radius:12px;padding:12px 13px;font:.82rem Montserrat,Arial,sans-serif;color:#4a5b70;background:#fbfdff}.form textarea{min-height:70px;resize:vertical}.companions{padding:14px;border:1px solid #eadfc9;border-radius:18px;background:#fffaf0}.head{display:flex;align-items:center;justify-content:space-between;gap:10px}.head-title{font-size:.68rem;font-weight:700;letter-spacing:.08em;color:#315889}.help{font-size:.58rem;color:#718095;margin-top:3px}.add{border:0;border-radius:999px;padding:9px 12px;background:#315889;color:#fff;font-size:.58rem;font-weight:700;cursor:pointer}.list{display:grid;gap:9px;margin-top:10px}.person{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center}.person input{margin:0}.kind{display:flex;gap:4px}.kind button,.remove{border:1px solid #d9e3ec;border-radius:10px;background:#fff;color:#315889;padding:9px 8px;font-size:.56rem;font-weight:700;cursor:pointer}.kind button.active{background:#eaf5fc;border-color:#9fc2dd}.remove{width:34px;height:34px;padding:0;border:0;border-radius:50%;background:#f7e6df;color:#ef7950;font-size:18px}.total{text-align:right;margin-top:9px;font-size:.6rem;color:#718095}.submit{margin-top:5px;width:100%;min-height:50px;border:0;border-radius:999px;background:#ef7950;color:#fff;font-size:.68rem;font-weight:800;letter-spacing:.13em;cursor:pointer}.submit:disabled{opacity:.6}.status{text-align:center;min-height:20px;font-size:.72rem;margin-top:5px}.ok{color:#5d9b55}.error{color:#c45555}.success{text-align:center;padding:25px 8px 10px}.success .mark{font-size:2rem;color:#b49a72}.success h2{font:2.5rem Georgia,serif;color:#315889;margin:8px 0}.success p{font-size:.8rem;line-height:1.7}@media(max-width:600px){body{padding:0}.card{min-height:100svh;border-radius:0;padding:24px 18px}.head{align-items:flex-start;flex-direction:column}.add{width:100%}.person{grid-template-columns:minmax(0,1fr) auto}.kind{grid-column:1}.remove{grid-column:2;grid-row:1/3;align-self:center}}
</style>
</head>
<body>
<main class="card">
<button class="close" type="button" onclick="history.back()" aria-label="Cerrar">×</button>
<div id="content">
<div class="kicker">MÁXIMO · BAUTIZO & CUMPLEAÑOS</div>
<div class="title">¿Nos acompañas?</div>
<p class="sub">Queremos tener todo listo para recibirte. Confirma tu asistencia.</p>
<form class="form" id="form">
<label>Nombre completo *<input name="nombre_completo" required autocomplete="name"></label>
<label>Número telefónico *<input name="telefono" required type="tel" autocomplete="tel"></label>
<label>¿Confirmas tu asistencia? *<select name="asistencia" required><option value="">Selecciona una opción</option><option value="si">Sí, ahí estaremos</option><option value="no">No podremos acompañarte</option><option value="aun_no_se">Aún no lo sé</option></select></label>
<div class="companions"><div class="head"><div><div class="head-title">ACOMPAÑANTES</div><div class="help">Agrega a cada persona por separado.</div></div><button class="add" id="add" type="button">+ AGREGAR ACOMPAÑANTE</button></div><div class="list" id="list"></div><div class="total" id="total">0 acompañantes · 0 adultos · 0 menores</div></div>
<label>Comentarios<textarea name="comentarios" placeholder="Cualquier comentario adicional"></textarea></label>
<button class="submit" id="submit" type="submit">ENVIAR CONFIRMACIÓN</button><div class="status" id="status"></div>
</form></div></main>
<script>
const form=document.getElementById('form'),list=document.getElementById('list'),add=document.getElementById('add'),total=document.getElementById('total'),status=document.getElementById('status'),submit=document.getElementById('submit');let people=[];
function count(){const minors=people.filter(p=>p.es_menor).length,adults=people.length-minors;total.textContent=`${people.length} acompañante${people.length===1?'':'s'} · ${adults} adulto${adults===1?'':'s'} · ${minors} menor${minors===1?'':'es'}`}
function render(){list.innerHTML='';people.forEach((p,i)=>{const row=document.createElement('div');row.className='person';row.innerHTML='<input maxlength="120" placeholder="Nombre del acompañante"><div class="kind"><button type="button">Adulto</button><button type="button">Menor</button></div><button type="button" class="remove" aria-label="Eliminar">×</button>';const input=row.querySelector('input'),buttons=row.querySelectorAll('.kind button');input.value=p.nombre;buttons[0].classList.toggle('active',!p.es_menor);buttons[1].classList.toggle('active',p.es_menor);input.oninput=()=>{people[i].nombre=input.value;count()};buttons[0].onclick=()=>{people[i].es_menor=false;render()};buttons[1].onclick=()=>{people[i].es_menor=true;render()};row.querySelector('.remove').onclick=()=>{people.splice(i,1);render()};list.appendChild(row)});count()}
add.onclick=()=>{if(people.length<20){people.push({nombre:'',es_menor:false});render();list.lastElementChild?.querySelector('input')?.focus()}};
form.onsubmit=async e=>{e.preventDefault();status.className='status';status.textContent='';const companions=people.filter(p=>p.nombre.trim()).map(p=>({nombre_completo:p.nombre.trim(),es_menor:p.es_menor}));const data=Object.fromEntries(new FormData(form).entries());data.acompanantes=companions;data.menores_18=companions.filter(p=>p.es_menor).length;submit.disabled=true;submit.textContent='ENVIANDO...';try{const res=await fetch('https://wiipskndjwnhmqylwvwh.supabase.co/functions/v1/registrar-confirmacion',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await res.json().catch(()=>({}));if(!res.ok)throw new Error(result.error||'No fue posible registrar la confirmación.');document.getElementById('content').innerHTML='<div class="success"><div class="mark">✦</div><h2>¡Gracias!</h2><p>Tu confirmación quedó registrada correctamente.<br>Nos encantará compartir este día contigo.</p></div>'}catch(err){status.className='status error';status.textContent=err.message||'No fue posible enviar la confirmación.';submit.disabled=false;submit.textContent='ENVIAR CONFIRMACIÓN'}};
render();
</script>
</body></html>
