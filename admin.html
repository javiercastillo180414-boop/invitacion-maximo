<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Máximo | Confirmaciones</title><style>body{margin:0;font-family:Arial,sans-serif;background:#eaf5fc;color:#315889}.wrap{max-width:1200px;margin:auto;padding:32px 18px}.head{text-align:center;margin-bottom:28px}.head h1{font:48px Georgia,serif;margin:5px}.head p{margin:0;color:#6d7d90}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.card{background:#fff;border-radius:18px;padding:18px;text-align:center;box-shadow:0 8px 25px #31588918}.num{font-size:28px;font-weight:800}.label{font-size:11px;letter-spacing:.08em;margin-top:6px;color:#6d7d90}.table-wrap{margin-top:24px;background:#fff;border-radius:18px;overflow:auto;box-shadow:0 8px 25px #31588918}table{width:100%;border-collapse:collapse;min-width:1100px}th,td{text-align:left;padding:13px;border-bottom:1px solid #edf1f5;font-size:13px;vertical-align:top}th{font-size:11px;letter-spacing:.06em;color:#6d7d90}.person{display:block;margin:3px 0}.type{display:inline-block;margin-left:5px;padding:3px 7px;border-radius:999px;font-size:10px;font-weight:700;background:#eef4fa;color:#315889}.minor{background:#f7ead6;color:#8a6334}.comment{display:block;min-width:180px;max-width:280px;white-space:pre-wrap;line-height:1.5;color:#4a5b70}.no-comment{color:#a5b0bb;font-style:italic}button{border:0;border-radius:999px;background:#315889;color:#fff;padding:11px 18px;font-weight:700;cursor:pointer}.actions{text-align:right;margin-bottom:14px}.status{text-align:center;margin:14px;color:#6d7d90}.login{max-width:390px;margin:80px auto;background:#fff;padding:30px;border-radius:22px;box-shadow:0 12px 35px #31588918}.login h2{font:34px Georgia,serif;text-align:center;margin:0 0 8px}.login p{text-align:center;color:#6d7d90;font-size:14px}.login input{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border:1px solid #d8e2eb;border-radius:12px}.login button{width:100%;margin-top:8px}.error{color:#a23b3b;text-align:center;min-height:20px;font-size:13px}.topbar{display:flex;justify-content:flex-end;margin-bottom:10px}.hidden{display:none}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.wrap{padding:22px 12px}.head h1{font-size:38px}} </style></head><body><section id="login" class="login"><h2>Confirmaciones</h2><p>Máximo · 24 de octubre de 2026</p><input id="email" type="email" autocomplete="email" placeholder="Correo electrónico"><input id="password" type="password" autocomplete="current-password" placeholder="Contraseña"><button id="loginBtn">ENTRAR</button><div id="loginError" class="error"></div></section><main id="app" class="wrap hidden"><div class="topbar"><button id="logout">CERRAR SESIÓN</button></div><header class="head"><div>BAUTIZO & CUMPLEAÑOS</div><h1>Confirmaciones</h1><p>Máximo · 24 de octubre de 2026</p></header><section class="cards" id="cards"></section><div class="actions"><button id="refresh">ACTUALIZAR</button></div><div class="table-wrap"><table><thead><tr><th>INVITADO</th><th>TELÉFONO</th><th>ASISTENCIA</th><th>ACOMPAÑANTES</th><th>ADULTOS</th><th>MENORES</th><th>TOTAL</th><th>COMENTARIOS</th><th>FECHA</th></tr></thead><tbody id="rows"></tbody></table></div><div class="status" id="status"></div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const supabase=createClient('https://wiipskndjwnhmqylwvwh.supabase.co','sb_publishable_xBPYV2Cl-WE15poN6vVzng_MCy5KWjV');const login=document.getElementById('login'),app=document.getElementById('app'),loginBtn=document.getElementById('loginBtn'),loginError=document.getElementById('loginError'),email=document.getElementById('email'),password=document.getElementById('password'),logout=document.getElementById('logout'),refresh=document.getElementById('refresh'),cards=document.getElementById('cards'),rows=document.getElementById('rows'),status=document.getElementById('status');function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function showSession(){const{data:{session}}=await supabase.auth.getSession();if(session){login.classList.add('hidden');app.classList.remove('hidden');load()}else{login.classList.remove('hidden');app.classList.add('hidden')}}loginBtn.onclick=async()=>{loginError.textContent='';loginBtn.disabled=true;const{error}=await supabase.auth.signInWithPassword({email:email.value.trim(),password:password.value});loginBtn.disabled=false;if(error){loginError.textContent='Correo o contraseña incorrectos.';return}showSession()};password.onkeydown=e=>{if(e.key==='Enter')loginBtn.click()};logout.onclick=async()=>{await supabase.auth.signOut();showSession()};refresh.onclick=load;supabase.auth.onAuthStateChange(()=>showSession());async function load(){status.textContent='Cargando...';const{data,error}=await supabase.from('confirmaciones_evento').select('*,acompanantes_evento(*)').order('created_at',{ascending:false});if(error){status.textContent='No fue posible cargar las confirmaciones.';return}const stats={confirmados:0,no:0,pendientes:0,adultos:0,menores:0,total:0};rows.innerHTML=data.map(x=>{const cs=x.acompanantes_evento||[];const minors=cs.filter(c=>c.es_menor).length;const adults=cs.length-minors;const total=1+cs.length;if(x.asistencia==='si'){stats.confirmados++;stats.adultos+=adults+1;stats.menores+=minors;stats.total+=total}else if(x.asistencia==='no')stats.no++;else stats.pendientes++;const people=cs.map(c=>`<span class="person">${esc(c.nombre_completo)} <span class="type ${c.es_menor?'minor':''}">${c.es_menor?'Menor':'Adulto'}</span></span>`).join('')||'—';const comment=String(x.comentarios??'').trim();const commentHtml=comment?`<span class="comment">${esc(comment)}</span>`:'<span class="no-comment">Sin comentarios</span>';return `<tr><td>${esc(x.nombre_completo)}</td><td>${esc(x.telefono)}</td><td>${esc(x.asistencia)}</td><td>${people}</td><td>${x.asistencia==='si'?adults+1:0}</td><td>${x.asistencia==='si'?minors:0}</td><td>${x.asistencia==='si'?total:0}</td><td>${commentHtml}</td><td>${new Date(x.created_at).toLocaleString('es-MX')}</td></tr>`}).join('');cards.innerHTML=[['CONFIRMADOS',stats.confirmados],['NO ASISTEN',stats.no],['PENDIENTES',stats.pendientes],['ADULTOS',stats.adultos],['MENORES',stats.menores],['TOTAL PERSONAS',stats.total]].map(x=>`<div class="card"><div class="num">${x[1]}</div><div class="label">${x[0]}</div></div>`).join('');status.textContent=`${data.length} confirmación(es)`}showSession();</script></body></html>
