<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Máximo | Confirmaciones</title><style>body{margin:0;font-family:Arial,sans-serif;background:#eaf5fc;color:#315889}.wrap{max-width:1100px;margin:auto;padding:32px 18px}.head{text-align:center;margin-bottom:28px}.head h1{font:48px Georgia,serif;margin:5px}.head p{margin:0;color:#6d7d90}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.card{background:#fff;border-radius:18px;padding:18px;text-align:center;box-shadow:0 8px 25px #31588918}.num{font-size:28px;font-weight:800}.label{font-size:11px;letter-spacing:.08em;margin-top:6px;color:#6d7d90}.table-wrap{margin-top:24px;background:#fff;border-radius:18px;overflow:auto;box-shadow:0 8px 25px #31588918}table{width:100%;border-collapse:collapse;min-width:800px}th,td{text-align:left;padding:13px;border-bottom:1px solid #edf1f5;font-size:13px}th{font-size:11px;letter-spacing:.06em;color:#6d7d90}button{border:0;border-radius:999px;background:#315889;color:#fff;padding:11px 18px;font-weight:700;cursor:pointer}.actions{text-align:right;margin-bottom:14px}.status{text-align:center;margin:14px;color:#6d7d90}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}} </style></head><body><main class="wrap"><header class="head"><div>BAUTIZO & CUMPLEAÑOS</div><h1>Confirmaciones</h1><p>Máximo · 24 de octubre de 2026</p></header><section class="cards" id="cards"></section><div class="actions"><button id="refresh">ACTUALIZAR</button></div><div class="table-wrap"><table><thead><tr><th>INVITADO</th><th>TELÉFONO</th><th>ASISTENCIA</th><th>ACOMPAÑANTES</th><th>ADULTOS</th><th>MENORES</th><th>TOTAL</th><th>FECHA</th></tr></thead><tbody id="rows"></tbody></table></div><div class="status" id="status"></div></main><script>const URL='https://wiipskndjwnhmqylwvwh.supabase.co/rest/v1/confirmaciones_evento?select=*,acompanantes_evento(*)&order=created_at.desc';const KEY='';async function load(){status.textContent='Cargando...';try{const r=await fetch(URL,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!r.ok)throw Error();const data=await r.json();const stats={confirmados:0,no:0,pendientes:0,adultos:0,menores:0,total:0};rows.innerHTML=data.map(x=>{const cs=x.acompanantes_evento||[];const minors=cs.filter(c=>c.es_menor).length;const adults=cs.length-minors;const total=1+cs.length;if(x.asistencia==='si')stats.confirmados++;else if(x.asistencia==='no')stats.no++;else stats.pendientes++;if(x.asistencia==='si'){stats.adultos+=adults+1;stats.menores+=minors;stats.total+=total}return `<tr><td>${esc(x.nombre_completo)}</td><td>${esc(x.telefono)}</td><td>${esc(x.asistencia)}</td><td>${cs.map(c=>esc(c.nombre_completo)).join(', ')||'—'}</td><td>${adults+1}</td><td>${minors}</td><td>${x.asistencia==='si'?total:0}</td><td>${new Date(x.created_at).toLocaleString('es-MX')}</td></tr>`}).join('');cards.innerHTML=[['CONFIRMADOS',stats.confirmados],['NO ASISTEN',stats.no],['PENDIENTES',stats.pendientes],['ADULTOS',stats.adultos],['MENORES',stats.menores],['TOTAL PERSONAS',stats.total]].map(x=>`<div class="card"><div class="num">${x[1]}</div><div class="label">${x[0]}</div></div>`).join('');status.textContent=`${data.length} confirmación(es)`}catch(e){status.textContent='No fue posible cargar las confirmaciones.'}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}refresh.onclick=load;load();</script></body></html>
