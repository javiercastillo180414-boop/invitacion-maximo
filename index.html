<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eaf5fc"><title>Máximo | Bienvenida</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Parisienne&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Georgia,'Times New Roman',serif;background:#eaf5fc}#invitation{position:absolute;inset:0;width:100%;height:100%;border:0}#welcome{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(145deg,#dceefa,#fff 55%,#fff4db);transition:opacity .7s ease,visibility .7s ease}#welcome.hide{opacity:0;visibility:hidden;pointer-events:none}.welcome-card{width:min(100%,430px);min-height:min(760px,calc(100svh - 48px));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 26px 34px;border:1px solid rgba(255,255,255,.95);border-radius:30px;background:rgba(255,255,255,.78);box-shadow:0 20px 60px rgba(49,88,137,.16);backdrop-filter:blur(8px)}.photo-frame{width:min(100%,310px);aspect-ratio:4/3;border-radius:24px;padding:7px;background:linear-gradient(145deg,#b49a72,#f5e9cf);box-shadow:0 14px 34px rgba(49,88,137,.16);margin-bottom:24px}.photo-frame img{display:block;width:100%;height:100%;object-fit:contain;object-position:center;border-radius:18px;border:5px solid #fff;background:#fff}.mini{font:600 .62rem Montserrat,Arial,sans-serif;letter-spacing:.25em;color:#315889;text-transform:uppercase}.name{font:3.8rem Parisienne,'Brush Script MT',cursive;color:#315889;line-height:1;margin:9px 0}.phrase{max-width:300px;color:#5e6e82;font:italic 1.05rem/1.55 Georgia,serif}.event{margin-top:15px;color:#b49a72;font:600 1rem/1.4 Georgia,serif;letter-spacing:.08em}.tap{margin-top:27px;color:#315889;font:700 .65rem Montserrat,Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase}.tap span{display:block;margin-top:9px;font-size:1.15rem;animation:pulse 1.6s infinite}@keyframes pulse{50%{transform:translateY(4px);opacity:.55}}#rsvpOverlay{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(25,43,66,.72)}#rsvpOverlay.open{display:flex}.rsvp-card{width:min(100%,520px);max-height:94svh;overflow:auto;background:#fff;border-radius:28px;padding:30px 22px 24px;box-shadow:0 25px 80px rgba(0,0,0,.22);position:relative;color:#4a5b70}.rsvp-close{position:absolute;right:12px;top:12px;width:38px;height:38px;border:0;border-radius:50%;background:#eef5fb;color:#315889;font-size:23px;cursor:pointer}.rsvp-kicker{text-align:center;font:700 .6rem Montserrat,sans-serif;letter-spacing:.2em;color:#b49a72}.rsvp-title{text-align:center;font:2.8rem Parisienne,cursive;color:#315889;margin:5px 0}.rsvp-sub{text-align:center;font:.78rem/1.6 Montserrat,Arial,sans-serif;margin:0 auto 22px;max-width:390px}.rsvp-form{display:grid;gap:13px}.rsvp-form label{font:700 .62rem Montserrat,Arial,sans-serif;letter-spacing:.08em;color:#315889}.rsvp-form input,.rsvp-form select,.rsvp-form textarea{width:100%;margin-top:6px;border:1px solid #d9e3ec;border-radius:12px;padding:12px 13px;font:400 .82rem Montserrat,Arial,sans-serif;color:#4a5b70;background:#fbfdff;outline:none}.rsvp-form textarea{min-height:78px;resize:vertical}.rsvp-form input:focus,.rsvp-form select:focus,.rsvp-form textarea:focus{border-color:#b49a72;box-shadow:0 0 0 3px rgba(180,154,114,.12)}.rsvp-submit{margin-top:5px;min-height:50px;border:0;border-radius:999px;background:#ef7950;color:#fff;font:800 .68rem Montserrat,sans-serif;letter-spacing:.13em;cursor:pointer}.rsvp-submit:disabled{opacity:.6;cursor:wait}.rsvp-status{text-align:center;font:600 .72rem/1.5 Montserrat,Arial,sans-serif;margin:3px 0 0;min-height:20px}.rsvp-status.ok{color:#5d9b55}.rsvp-status.error{color:#c45555}.rsvp-success{text-align:center;padding:25px 8px 10px}.rsvp-success .mark{font-size:2rem;color:#b49a72}.rsvp-success h3{font:2.5rem Parisienne,cursive;color:#315889;margin:8px 0}.rsvp-success p{font:.8rem/1.7 Montserrat,Arial,sans-serif}.rsvp-cancel{display:block;margin:18px auto 0;border:0;background:transparent;color:#315889;font:700 .62rem Montserrat,sans-serif;letter-spacing:.12em;cursor:pointer}@media(max-width:600px){#welcome{padding:0}.welcome-card{min-height:100svh;width:100%;border:0;border-radius:0;box-shadow:none;background:rgba(255,255,255,.7)}.photo-frame{width:min(86vw,360px);aspect-ratio:4/3;margin-bottom:22px}.name{font-size:3.5rem}.rsvp-card{max-height:100svh;border-radius:22px;padding:28px 18px 20px}}@media(prefers-reduced-motion:reduce){#welcome{transition:none}.tap span{animation:none}}</style></head><body><iframe id="invitation" src="/invitation.html" title="Invitación de Máximo"></iframe><section id="welcome" aria-label="Bienvenida"><div class="welcome-card"><div class="photo-frame"><img src="/assets/WhatsApp%20Image%202026-08-28%20at%205.22.20%20PM.jpeg" alt="Máximo"></div><div class="mini">Con mucho amor</div><div class="name">Máximo</div><div class="phrase">“Un día para celebrar su fe, su vida y toda la alegría que nos regala.”</div><div class="event">BAUTIZO &amp; CUMPLEAÑOS<br>24 · OCTUBRE · 2026</div><div class="tap">Toca la pantalla para comenzar<span>⌄</span></div></div></section><div id="rsvpOverlay" role="dialog" aria-modal="true" aria-labelledby="rsvpTitle"><div class="rsvp-card"><button class="rsvp-close" id="rsvpClose" type="button" aria-label="Cerrar">×</button><div id="rsvpContent"><div class="rsvp-kicker">MÁXIMO · BAUTIZO &amp; CUMPLEAÑOS</div><div class="rsvp-title" id="rsvpTitle">¿Nos acompañas?</div><p class="rsvp-sub">Queremos tener todo listo para recibirte. Confirma tu asistencia.</p><form class="rsvp-form" id="rsvpForm"><label>Nombre completo *<input name="nombre_completo" required autocomplete="name"></label><label>Número telefónico *<input name="telefono" required type="tel" autocomplete="tel"></label><label>¿Confirmas tu asistencia? *<select name="asistencia" required><option value="">Selecciona una opción</option><option value="si">Sí, ahí estaremos</option><option value="no">No podremos acompañarte</option><option value="aun_no_se">Aún no lo sé</option></select></label><label>Nombre completo de tus acompañantes<textarea name="acompanantes" placeholder="Escribe sus nombres, si aplica"></textarea></label><label>¿Cuántos acompañantes son menores de 18 años? *<input name="menores_18" type="number" min="0" step="1" value="0" required></label><label>Comentarios<textarea name="comentarios" placeholder="Cualquier comentario adicional"></textarea></label><button class="rsvp-submit" id="rsvpSubmit" type="submit">ENVIAR CONFIRMACIÓN</button><div class="rsvp-status" id="rsvpStatus" aria-live="polite"></div></form></div></div></div></div><audio id="music" preload="auto" loop><source src="/assets/Harry%20Styles%20-%20As%20It%20Was%20(Lyrics).mp3" type="audio/mpeg"></audio><script>const welcome=document.getElementById('welcome'),music=document.getElementById('music'),invitation=document.getElementById('invitation'),rsvpOverlay=document.getElementById('rsvpOverlay'),rsvpForm=document.getElementById('rsvpForm'),rsvpStatus=document.getElementById('rsvpStatus'),rsvpSubmit=document.getElementById('rsvpSubmit');music.volume=.35;function stopInvitationMusic(){try{const childAudio=invitation.contentDocument?.getElementById('bgMusic');if(childAudio){childAudio.pause();childAudio.currentTime=0;childAudio.volume=0}}catch(e){}}function openRsvp(){stopInvitationMusic();rsvpOverlay.classList.add('open');document.body.style.overflow='hidden';try{const doc=invitation.contentDocument;const btn=doc?.querySelector('.confirm button');if(btn)btn.blur()}catch(e){}}function closeRsvp(){rsvpOverlay.classList.remove('open');document.body.style.overflow=''}function bindRsvp(){try{const doc=invitation.contentDocument;if(!doc)return;const btn=doc.querySelector('.confirm button');if(btn&&!btn.dataset.rsvpBound){btn.dataset.rsvpBound='1';btn.onclick=e=>{e.preventDefault();e.stopPropagation();openRsvp()}}}catch(e){}}invitation.addEventListener('load',()=>{stopInvitationMusic();bindRsvp()});async function start(){stopInvitationMusic();try{await music.play()}catch(e){}welcome.classList.add('hide');setTimeout(()=>welcome.remove(),800);setTimeout(bindRsvp,100)}welcome.addEventListener('click',start,{once:true});welcome.addEventListener('touchend',start,{once:true});document.getElementById('rsvpClose').addEventListener('click',closeRsvp);rsvpOverlay.addEventListener('click',e=>{if(e.target===rsvpOverlay)closeRsvp()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeRsvp()});rsvpForm.addEventListener('submit',async e=>{e.preventDefault();rsvpStatus.className='rsvp-status';rsvpStatus.textContent='';rsvpSubmit.disabled=true;rsvpSubmit.textContent='ENVIANDO...';const data=Object.fromEntries(new FormData(rsvpForm).entries());data.menores_18=Number(data.menores_18||0);try{const res=await fetch('https://wiipskndjwnhmqylwvwh.supabase.co/functions/v1/registrar-confirmacion',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await res.json().catch(()=>({}));if(!res.ok)throw new Error(result.error||'No fue posible registrar la confirmación.');document.getElementById('rsvpContent').innerHTML='<div class="rsvp-success"><div class="mark">✦</div><h3>¡Gracias!</h3><p>Tu confirmación quedó registrada correctamente.<br>Nos encantará compartir este día contigo.</p><button class="rsvp-cancel" type="button" onclick="closeRsvp()">CERRAR</button></div>'}catch(err){rsvpStatus.className='rsvp-status error';rsvpStatus.textContent=err.message||'No fue posible enviar la confirmación.';rsvpSubmit.disabled=false;rsvpSubmit.textContent='ENVIAR CONFIRMACIÓN'}});</script></body></html>
