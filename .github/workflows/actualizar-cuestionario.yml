name: Actualizar cuestionario

on:
  push:
    paths:
      - '.github/workflows/actualizar-cuestionario.yml'
      - 'invitation.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/actual
          fetch-depth: 0

      - name: Update invitation questionnaire
        env:
          SUPABASE_FUNCTION_URL: https://wiipskndjwnhmqylwvwh.supabase.co/functions/v1/registrar-confirmacion
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          p = Path('invitation.html')
          s = p.read_text(encoding='utf-8')

          old_modal = '<div class="modal" id="modal"><div class="modal-card"><button class="close" onclick="closeForm()">×</button><iframe title="Confirmación de asistencia" src="https://docs.google.com/forms/d/e/1FAIpQLSdR-tk--F2S3v5OrZ7avNVmPTu1G78zcNNCi1VwWli6DTldoA/viewform?embedded=true" style="width:100%;height:100%;border:0"></iframe></div></div>'
          new_modal = '''<div class="modal" id="modal"><div class="modal-card"><button class="close" onclick="closeForm()">×</button><div class="rsvp-wrap"><div class="rsvp-head"><div class="eyebrow">CELEBREMOS JUNTOS</div><div class="script">Confirmación</div><h2>de asistencia</h2><p>Ayúdanos a tener todo listo para recibirte.</p></div><form id="rsvpForm" class="rsvp-form"><label>Nombre completo *<input id="rsvpName" required maxlength="120" autocomplete="name" placeholder="Escribe tu nombre"></label><label>Teléfono *<input id="rsvpPhone" required maxlength="30" autocomplete="tel" inputmode="tel" placeholder="Tu número de teléfono"></label><fieldset><legend>¿Confirmas tu asistencia? *</legend><div class="choice-grid"><label><input type="radio" name="asistencia" value="si" required><span>Sí, ahí estaré</span></label><label><input type="radio" name="asistencia" value="no"><span>No podré asistir</span></label><label><input type="radio" name="asistencia" value="aun_no_se"><span>Aún no lo sé</span></label></div></fieldset><div id="companionsBox" class="companions-box"><div class="companions-title"><div><strong>Acompañantes</strong><small>Agrega a cada persona por separado.</small></div><button type="button" id="addCompanion" class="add-companion">+ AGREGAR ACOMPAÑANTE</button></div><div id="companionsList"></div><div class="totals" id="companionTotals">0 acompañantes · 0 menores</div></div><label>Comentarios <textarea id="rsvpComments" maxlength="500" rows="3" placeholder="Algún comentario que quieras compartirnos"></textarea></label><button class="btn party-btn rsvp-submit" id="rsvpSubmit" type="submit">ENVIAR CONFIRMACIÓN</button><div id="rsvpStatus" class="rsvp-status" role="status" aria-live="polite"></div></form></div></div></div>'''

          if old_modal not in s:
              raise SystemExit('No se encontró el modal esperado; no se modificó el archivo.')
          s = s.replace(old_modal, new_modal, 1)

          css = '''.rsvp-wrap{height:100%;overflow:auto;padding:34px 22px 28px;background:linear-gradient(180deg,#fff,#fffaf0)}.rsvp-head{text-align:center;margin-bottom:22px}.rsvp-head .script{font-size:clamp(2.7rem,9vw,4.2rem);margin-top:4px}.rsvp-head h2{font:600 1.8rem 'Cormorant Garamond',serif;color:var(--blue);margin:0}.rsvp-head p{font-size:.78rem;line-height:1.7;margin:10px auto;max-width:430px}.rsvp-form{max-width:540px;margin:auto;display:grid;gap:15px}.rsvp-form>label,.rsvp-form fieldset{display:grid;gap:7px}.rsvp-form>label,.rsvp-form legend{font-size:.68rem;font-weight:700;letter-spacing:.04em;color:var(--blue)}.rsvp-form input[type=text],.rsvp-form input[type=tel],.rsvp-form textarea{width:100%;border:1px solid #d8e2eb;border-radius:13px;padding:12px 13px;font:500 .78rem Montserrat,sans-serif;color:var(--ink);background:#fff;outline:none}.rsvp-form textarea{resize:vertical}.rsvp-form input:focus,.rsvp-form textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(49,88,137,.08)}.rsvp-form fieldset{border:0;padding:0;margin:0}.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.choice-grid label{position:relative}.choice-grid input{position:absolute;opacity:0}.choice-grid span{display:flex;align-items:center;justify-content:center;min-height:48px;text-align:center;padding:7px;border:1px solid #d8e2eb;border-radius:13px;background:#fff;font-size:.65rem;line-height:1.3;cursor:pointer}.choice-grid input:checked+span{border-color:var(--coral);background:#fff4ee;color:var(--coral);font-weight:700}.companions-box{padding:15px;border:1px solid #eadfc9;border-radius:17px;background:rgba(255,250,240,.72)}.companions-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:11px}.companions-title strong{display:block;color:var(--blue);font-size:.75rem}.companions-title small{display:block;color:#718095;font-size:.6rem;font-weight:400;margin-top:3px}.add-companion{border:0;border-radius:999px;padding:9px 12px;background:var(--blue);color:#fff;font:700 .58rem Montserrat,sans-serif;letter-spacing:.04em;cursor:pointer;white-space:nowrap}.companion-row{display:grid;grid-template-columns:1fr auto auto;gap:7px;align-items:center;margin-top:8px}.companion-row input{min-width:0}.companion-type{display:flex;gap:4px}.companion-type button{border:1px solid #d8e2eb;border-radius:10px;background:#fff;color:var(--blue);padding:9px 8px;font:600 .58rem Montserrat,sans-serif;cursor:pointer}.companion-type button.active{background:#eaf5fc;border-color:#9fc2dd}.remove-companion{width:34px;height:34px;border:0;border-radius:50%;background:#f7e6df;color:var(--coral);font-size:18px;cursor:pointer}.totals{font-size:.62rem;color:#718095;margin-top:10px;text-align:right}.rsvp-submit{width:100%;margin-top:2px}.rsvp-status{min-height:20px;text-align:center;font-size:.7rem;line-height:1.5}.rsvp-status.success{color:#4f8b5a}.rsvp-status.error{color:#b64d42}@media(max-width:600px){.modal-card{height:min(94svh,900px)}.rsvp-wrap{padding:30px 16px 24px}.choice-grid{grid-template-columns:1fr}.companions-title{align-items:flex-start;flex-direction:column}.add-companion{width:100%}.companion-row{grid-template-columns:1fr auto}.companion-type{grid-column:1}.remove-companion{grid-column:2;grid-row:1/3;align-self:center}}'''
          s = s.replace('</style>', css + '</style>', 1)

          start = s.index('<script>')
          end = s.index('</script>', start) + len('</script>')
          endpoint = os.environ['SUPABASE_FUNCTION_URL']
          script = f'''<script>const modal=document.getElementById('modal');const music=document.getElementById('bgMusic');const musicControl=document.getElementById('musicControl');const rsvpForm=document.getElementById('rsvpForm');const companionsList=document.getElementById('companionsList');const companionsBox=document.getElementById('companionsBox');const companionTotals=document.getElementById('companionTotals');const rsvpStatus=document.getElementById('rsvpStatus');const rsvpSubmit=document.getElementById('rsvpSubmit');const functionUrl={endpoint!r};music.volume=.35;function setMusicButton(){{const playing=!music.paused;musicControl.classList.toggle('playing',playing);musicControl.textContent=playing?'❚❚':'♫';musicControl.setAttribute('aria-label',playing?'Pausar música':'Reproducir música');musicControl.title=playing?'Pausar música':'Reproducir música'}}async function playMusic(){{try{{await music.play();setMusicButton()}}catch(e){{}}}}function pauseMusic(){{music.pause();setMusicButton()}}musicControl.addEventListener('click',()=>music.paused?playMusic():pauseMusic());document.addEventListener('click',e=>{{if(e.target!==musicControl&&!modal.classList.contains('open')&&music.paused)playMusic()}},{{once:true}});function openForm(){{modal.classList.add('open');document.body.style.overflow='hidden';pauseMusic();rsvpStatus.textContent='';rsvpStatus.className='rsvp-status'}}function closeForm(){{modal.classList.remove('open');document.body.style.overflow=''}}modal.addEventListener('click',e=>{{if(e.target===modal)closeForm()}});document.addEventListener('keydown',e=>{{if(e.key==='Escape')closeForm()}});let companions=[];function renderCompanions(){{companionsList.innerHTML='';companions.forEach((c,i)=>{{const row=document.createElement('div');row.className='companion-row';row.innerHTML=`<input type="text" maxlength="120" placeholder="Nombre del acompañante" value="${{c.nombre.replaceAll('&','&amp;').replaceAll('"','&quot;')}}"><div class="companion-type"><button type="button" class="${{c.es_menor?'':'active'}}">Adulto</button><button type="button" class="${{c.es_menor?'active':''}}">Menor</button></div><button type="button" class="remove-companion" aria-label="Eliminar acompañante">×</button>`;const input=row.querySelector('input');const typeButtons=row.querySelectorAll('.companion-type button');input.addEventListener('input',()=>{{companions[i].nombre=input.value;updateTotals()}});typeButtons[0].addEventListener('click',()=>{{companions[i].es_menor=false;renderCompanions()}});typeButtons[1].addEventListener('click',()=>{{companions[i].es_menor=true;renderCompanions()}});row.querySelector('.remove-companion').addEventListener('click',()=>{{companions.splice(i,1);renderCompanions()}});companionsList.appendChild(row)}});updateTotals()}}function updateTotals(){{const minors=companions.filter(c=>c.es_menor).length;companionTotals.textContent=`${{companions.length}} acompañante${{companions.length===1?'':'s'}} · ${{minors}} menor${{minors===1?'':'es'}}`}}document.getElementById('addCompanion').addEventListener('click',()=>{{if(companions.length>=20)return;companions.push({{nombre:'',es_menor:false}});renderCompanions();companionsList.lastElementChild?.querySelector('input')?.focus()}});document.querySelectorAll('input[name="asistencia"]').forEach(r=>r.addEventListener('change',()=>{{companionsBox.style.display=r.value==='no'?'none':'block';if(r.value==='no'){{companions=[];renderCompanions()}}}}));rsvpForm.addEventListener('submit',async e=>{{e.preventDefault();rsvpStatus.textContent='';rsvpStatus.className='rsvp-status';const nombre_completo=document.getElementById('rsvpName').value.trim();const telefono=document.getElementById('rsvpPhone').value.trim();const asistencia=document.querySelector('input[name="asistencia"]:checked')?.value;const comentarios=document.getElementById('rsvpComments').value.trim();const validCompanions=companions.filter(c=>c.nombre.trim()).map(c=>({{nombre_completo:c.nombre.trim(),es_menor:c.es_menor}}));if(!asistencia)return;rsvpSubmit.disabled=true;rsvpSubmit.textContent='ENVIANDO...';try{{const res=await fetch(functionUrl,{{method:'POST',headers:{{'Content-Type':'application/json'}},body:JSON.stringify({{nombre_completo,telefono,asistencia,acompanantes:validCompanions,comentarios}})}});const data=await res.json().catch(()=>({{}}));if(!res.ok)throw new Error(data.error||'Error');rsvpStatus.textContent='¡Gracias! Tu confirmación quedó registrada.';rsvpStatus.className='rsvp-status success';rsvpForm.reset();companions=[];renderCompanions()}}catch(err){{rsvpStatus.textContent='No pudimos registrar tu confirmación. Inténtalo nuevamente.';rsvpStatus.className='rsvp-status error'}}finally{{rsvpSubmit.disabled=false;rsvpSubmit.textContent='ENVIAR CONFIRMACIÓN'}}}});renderCompanions();setMusicButton();</script>'''
          s = s[:start] + script + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/actualizar-cuestionario.yml
          git add invitation.html
          git diff --cached --quiet && exit 0
          git commit -m "Add individual companion questionnaire [skip ci]"
          git push origin HEAD:preview/actual
